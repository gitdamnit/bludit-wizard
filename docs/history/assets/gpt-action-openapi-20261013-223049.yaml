Open the draft “Hermes gets a SOUL(.md)” and summarize what’s currently there. Do not change anything.

The draft “Hermes gets a SOUL(.md)” is currently a long-form article/tutorial plus a ready-to-use SOUL.md prompt. I did not change anything.
What’s there

The opening explains the motivation: CLI coding agents often lack the convenient “personality/persona” settings found in consumer AI apps, so a global SOUL.md can serve as a persistent personality layer. It contrasts this with a project-specific AGENT.md and suggests placing SOUL.md in ~/.hermes/.

The introduction is deliberately irreverent and argues that LLMs can be excessively sycophantic, over-agreeable, flattering, and prone to confidently promising capabilities they don't actually have. It uses examples involving ChatGPT, emotional dependency/grandiosity claims, medical reliance, and the author's own experience with earlier models. The section ends with a GIGO point and frames the prompt as roughly “iteration 200+” of lessons learned.

There is also a partially unfinished sentence near the transition into the prompt:

    “Not sure if this would work for you? Change Hermes to whatever you'd like - throw it in your AI and prompt it to implement i”

Then the actual SOUL.md begins.
The SOUL itself

Its core identity is Hermes, described as the user's persistent AI collaborator, technical partner, researcher, critic, and independent-minded technical counterpart.

The governing philosophy is essentially:

truth > agreement, evidence > intuition, correctness > politeness, useful action > impressive prose.

Major sections include:

    Identity — establishes Hermes as skeptical, intelligent, independent, and willing to disagree.

    Relationship With $USER — treats the user as a capable technical collaborator, discourages flattery and unnecessary simplification, and emphasizes continuity/context.

    Epistemic Discipline — explicitly distinguishes facts, evidence-backed conclusions, inference, speculation, and unknowns; requires uncertainty to remain visible.

    Reasoning — stresses first principles, causal analysis, counterexamples, alternative hypotheses, and updating beliefs when evidence changes.

    Intellectual Honesty — prohibits fabricated citations, commands, APIs, tool output, test results, or claims of having inspected something that wasn't inspected.

    Communication Style — favors direct, information-dense answers, with structured formats for troubleshooting, decisions, research, and technical instructions.

    Voice — informal, sharp, human, occasionally sarcastic/profane, while explicitly banning canned assistant language and fake enthusiasm.

    Disagreement — says disagreement should be evidence-based rather than performative contrarianism.

    Ambiguity — says to make reasonable assumptions when possible and only ask clarifying questions when they materially matter.

    Technical Work — emphasizes diagnosis before changes, literal reading of errors, small/blast-radius-limited fixes, preservation of data/configuration, and avoiding ritualistic “reinstall everything” troubleshooting.

    Research — distinguishes marketing, documentation, independent reporting, user reports, controlled evidence, and speculation; also emphasizes incentives and who bears risk.

    Safety and Serious Matters — calls for less sarcasm and more precision around health, legal, financial, dangerous-equipment, and other high-consequence topics.

    Initiative — encourages spotting obvious failures and simpler solutions, but explicitly maintaining scope discipline.

    Efficiency — prioritizes the shortest path to a working answer and protecting the user's attention.

    Defaults — reinforces evidence-based agreement, labeled speculation, verification of current information, and investigation instead of increasingly elaborate guessing.

    Avoid — a long blacklist covering sycophancy, corporate voice, filler, fake certainty, generic troubleshooting, unnecessary questions, false balance, etc.

    Core Principle — closes by defining Hermes as the collaborator you'd choose when you want the answer correct rather than comforting.

Overall, the draft is structurally two pieces in one: a personal/argumentative introduction explaining why the prompt exists, followed by a fairly comprehensive reusable SOUL.md specification defining exactly how Hermes should behave.