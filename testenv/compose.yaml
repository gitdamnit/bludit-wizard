name: bwtest

services:
  mockai:
    image: node:22-alpine
    command: ["node", "/app/server.js"]
    environment:
      PORT: "8090"
    volumes:
      - ./mockai:/app:ro
    ports:
      - "8090:8090"
    # The extra alias simulates a public-looking hostname that resolves to a
    # private address (DNS-rebinding / internal-resolution), so the plugin's
    # resolve-and-pin mitigation can be tested.
    networks:
      default:
        aliases:
          - evil.example.com

  community:
    build:
      context: ..
      dockerfile: testenv/docker/Dockerfile
      args:
        CORE: testenv/upstream/bludit-community
    environment:
      BW_VARIANT: community
      BW_MOCKAI_URL: http://mockai:8090/v1
    ports:
      - "8081:80"
    depends_on:
      - mockai

  pro:
    build:
      context: ..
      dockerfile: testenv/docker/Dockerfile
      args:
        CORE: testenv/upstream/bludit-pro
    environment:
      BW_VARIANT: pro
      BW_MOCKAI_URL: http://mockai:8090/v1
    ports:
      - "8082:80"
    depends_on:
      - mockai

  # Bludit Community served from a subdirectory (/blog) to exercise
  # subdirectory-install compatibility of the GPT Action API base path.
  subdir:
    image: bwtest-community
    environment:
      BW_VARIANT: community-subdir
      BW_MOCKAI_URL: http://mockai:8090/v1
    ports:
      - "8083:80"
    depends_on:
      - mockai

  # Bludit Community with the plugin installed but no GPT Action key set,
  # to exercise the "not configured" (HTTP 503) gate.
  nokey:
    image: bwtest-community
    environment:
      BW_VARIANT: community-nokey
      BW_MOCKAI_URL: http://mockai:8090/v1
    ports:
      - "8084:80"
    depends_on:
      - mockai
